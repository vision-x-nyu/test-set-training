[project]
name = "test-set-training"
version = "1.0.0"
description = "Test-set Stress-Test (TsT): expose non-visual shortcuts in multimodal benchmarks (COLM 2026)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.13"
# The core (TsT-RF, reproduction scripts) is CPU only. Exact published values need the versions
# pinned in uv.lock / constraints.txt.
dependencies = [
    "huggingface-hub>=0.25",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15",
    "scikit-learn>=1.6",
    "scipy>=1.10",
    "text2digits>=0.1.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# TsT-LLM (and IBP with TsT-LLM scores): Linux x86_64, one NVIDIA GPU, CUDA 12.8 wheels.
llm = [
    "torch==2.7.0 ; sys_platform == 'linux'",
    "vllm==0.9.2 ; sys_platform == 'linux'",
    "transformers==4.52.4 ; sys_platform == 'linux'",
    "peft==0.15.2 ; sys_platform == 'linux'",
    "trl==0.9.6 ; sys_platform == 'linux'",
    "accelerate==1.7.0 ; sys_platform == 'linux'",
    "datasets==3.6.0 ; sys_platform == 'linux'",
    "pyyaml>=6 ; sys_platform == 'linux'",
    "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory@b8272a874b5ca59762d5386afcfd3d2fb71d5e00 ; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://vision-x-nyu.github.io/test-set-training/"
Repository = "https://github.com/vision-x-nyu/test-set-training"
Paper = "https://arxiv.org/abs/2511.04655"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.12.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "TsT"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not network'"
testpaths = ["tests"]
filterwarnings = [
    # the offline fixtures are small: some classes or folds are sparse
    "ignore:The least populated class in y:UserWarning",
    "ignore:All-NaN slice encountered:RuntimeWarning",
]
markers = [
    "network: downloads benchmark data from the Hugging Face Hub (deselected by default; run with -m network)",
    "slow: takes more than a few seconds",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
